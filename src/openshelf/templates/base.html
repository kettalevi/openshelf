<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Home{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">{{ app_name }}</a>
  <nav>
    {% for label, url in menu %}
      <a href="{{ url }}"{% if (url == '/' and request.url.path == '/') or (url != '/' and request.url.path.startswith(url)) %} class="active"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
  <div class="who">
    <a href="/account">{{ user.username }}</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="link">Sign out</button>
    </form>
  </div>
</header>
{% endif %}
<main>
  {% for f in flashes %}
    <div class="flash {{ f.level }}" role="status">{{ f.message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<footer>
  {{ app_name }} {{ version }} · {{ edition|title }} edition · AGPL-3.0 ·
  <a href="{{ source_url }}" rel="noopener">Source code</a>
</footer>
</body>
</html>
