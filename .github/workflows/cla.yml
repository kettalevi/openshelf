name: CLA Assistant

# Asks pull-request authors to sign CLA.md once, and records signatures in
# signatures/v1/cla.json on the `cla-signatures` branch.
#
# pull_request_target runs with write permissions, so this workflow must
# NEVER check out or run code from the pull request. It does neither.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - name: CLA Assistant
        # contributor-assistant/github-action v2.6.1, pinned to a commit
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/kettalevi/openshelf/blob/main/CLA.md"
          path-to-signatures: "signatures/v1/cla.json"
          branch: "cla-signatures"
          # The owner and automation accounts do not need to sign.
          allowlist: "kettalevi,dependabot*,github-actions*"
